[config]
schemaVersion = "0.0.1"

[package]
namespace = "Ageous27"
name = "CoopParryFix"
versionNumber = "0.3.0"
description = "Keeps the vanilla 250ms parry when you own the attacker; widens it by ping/jitter when the hit RPC is late."
websiteUrl = "https://github.com/Ageous27/CoopParryFix"
containsNsfwContent = false

[package.dependencies]
denikson-BepInExPack_Valheim = "5.4.2350"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./build"

[[build.copy]]
source = "./bin/Release/CoopParryFix.dll"
target = "/"

[[build.copy]]
source = "./CHANGELOG.md"
target = "/"

[publish]
repository = "https://thunderstore.io"
communities = ["valheim"]

[publish.categories]
valheim = ["mods", "combat", "client-side"]
